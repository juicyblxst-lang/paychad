name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paychad/config build
      - run: pnpm --filter @paychad/web typecheck
      - run: pnpm --filter @paychad/web build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: paychad
          POSTGRES_PASSWORD: paychad
          POSTGRES_DB: paychad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U paychad -d paychad_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://paychad:paychad@localhost:5432/paychad_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paychad/api typecheck
      - run: pnpm --filter @paychad/api build
      - run: pnpm --filter @paychad/api test
      - run: pnpm --filter @paychad/api db:migrate
      - run: pnpm --filter @paychad/api db:migrate
      - run: pnpm --filter @paychad/api db:validate

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build
      - run: forge test
